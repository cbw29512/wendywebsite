name: Rebuild verified hero asset

on:
  push:
    paths:
      - '.hero640/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild WebP from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .hero640/part-00 .hero640/part-01 .hero640/part-02 .hero640/part-03 | base64 --decode > assets/images/hero-wendy-640.webp
          echo 'c076c0d0eefd00d1f963084c973f9150cbe11b267b3a99d71c8f67712092bff9  assets/images/hero-wendy-640.webp' | sha256sum --check --strict
          test "$(stat -c%s assets/images/hero-wendy-640.webp)" -eq 25694

      - name: Commit verified binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/hero-wendy-640.webp
          if git diff --cached --quiet; then
            echo 'Verified hero asset already matches.'
            exit 0
          fi
          git commit -m 'assets: rebuild verified Wendy hero background'
          git push
