<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">From the Pond correspondence postmark</title>
  <desc id="desc">A red circular postal mark with a leaf in the center and From the Pond Correspondence around the ring.</desc>
  <defs>
    <path id="topArc" d="M 18,60 A 42,42 0 0 1 102,60"/>
    <path id="bottomArc" d="M 102,60 A 42,42 0 0 1 18,60"/>
  </defs>
  <g fill="none" stroke="#a32620" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="60" r="48" stroke-width="2.2"/>
    <circle cx="60" cy="60" r="35" stroke-width="1.2" opacity=".85"/>
    <path d="M22 61h16M82 61h16" stroke-width="1.2" opacity=".8"/>
  </g>
  <g fill="#a32620">
    <text font-family="Courier New, monospace" font-size="9.2" font-weight="700" letter-spacing="1.1">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">FROM THE POND</textPath>
    </text>
    <text font-family="Courier New, monospace" font-size="7.1" font-weight="700" letter-spacing=".8">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">CORRESPONDENCE</textPath>
    </text>
    <path d="M60 32c-10 8-18 18-18 30 0 11 8 20 18 25 10-5 18-14 18-25 0-12-8-22-18-30z"/>
  </g>
  <g fill="none" stroke="#f3dfc2" stroke-linecap="round">
    <path d="M60 39v39" stroke-width="1.7"/>
    <path d="M60 51l-10 8M60 58l11-8M60 65l-12 9M60 71l10 7" stroke-width="1.3"/>
  </g>
</svg>
